---
# Base Image
ee_base_image: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest
ee_aap_version: 2.6
ee_update_base_images: true
ee_builder_dir_clean: true
#ee_builder_dir: "."
ee_pull_collections_from_hub: true
ee_verbosity: 1

# download from access.redhat.com -> Downloads -> OpenShift Container Platform -> Packages
ocp_rpm_name: "openshift-clients-4.21.0-202603290052.p2.g9d9df34.assembly.stream.el9.x86_64.rpm"

ee_list:
  - name: ee-mitchell-labs-default
    tag: "{{ now(fmt='%m-%d-%Y') }}"
    build_items:
      - files/
    build_files:
      - src: "files/{{ ocp_rpm_name }}"
        dest: folders
      - src: "files/krb5.conf"
        dest: folders
    build_steps:
      prepend_base:
        - RUN $PYCMD -m pip install --upgrade pip setuptools
        - ADD _build/folders/krb5.conf /etc/krb5.conf

        #- RUN $PKGMGR -y remove python3.12-typing-extensions python3.12-referencing python3.12-jsonschema python3.12-ansible-compat python3.12-jsonschema-specifications ansible-lint
        - RUN $PYCMD -m pip install --upgrade pip setuptools
        # dependencies for redhat.openshift_virtualization
        # - ADD _build/folders/openshift-clients*.rpm /tmp/openshift-clients.rpm
        #- RUN $PKGMGR -y update && $PKGMGR -y install bash-completion && $PKGMGR clean all
        #- RUN rpm -ivh /tmp/openshift-clients.rpm && rm /tmp/openshift-clients.rpm
      prepend_builder:
        - ENV PKGMGR_OPTS "--nodocs --setopt install_weak_deps=0 --enablerepo=rhocp-4.21-for-rhel-9-*-rpms"
      prepend_final:
        - ENV PKGMGR_OPTS "--nodocs --setopt install_weak_deps=0 --enablerepo=rhocp-4.21-for-rhel-9-*-rpms"
      append_final:
        - RUN ln -sf /usr/bin/python3.12 /usr/bin/python3
    dependencies:
      python_interpreter:
        python_path: "/usr/bin/python3.12"
      python:
        # Zabbix
        - netaddr>=0.8.0
        - Jinja2>=3.1.2
        # Windows
        - pykerberos==1.2.4
        # Linux
        - firewall
      system:
        # Required for microsoft.ad, needs to match version of python_path
        - python3.12-devel [platform:rpm]
      galaxy:
        collections:
          # General
          - name: community.general
          - name: community.crypto
          # Hashicorp
          - name: community.hashi_vault
          # AAP
          - name: ansible.controller
          - name: ansible.platform
          # OCP
          - name: redhat.openshift_virtualization
          - name: redhat.openshift
          - name: kubernetes.core
          # Windows
          - name: microsoft.ad
          - name: chocolatey.chocolatey
          - name: ansible.windows
          - name: community.windows
          # zabbix
          - name: zabbix.zabbix
          - name: ansible.utils
          - name: ansible.posix
